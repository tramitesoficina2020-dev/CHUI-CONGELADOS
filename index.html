    const CATEGORIES = ["TODOS", "Sin TACC", "Congelados y Panificados", "Almacén y Viandas", "Dietética y Saludables", "Keto y Low Carb"];

    let activeCat = "TODOS";
    let searchTerm = "";
    const cart = {};

    function formatARS(num) {
      return "$" + num.toLocaleString("es-AR");
    }

    function renderTabs() {
      const wrap = document.getElementById("categoryTabs");
      wrap.innerHTML = CATEGORIES.map(cat => `
        <button class="tab-btn ${cat === activeCat ? 'active' : ''}" onclick="setCat('${cat}')">${cat}</button>
      `).join("");
    }

    function setCat(cat) {
      activeCat = cat;
      renderTabs();
      renderProducts();
    }

    function addToCart(id) {
      cart[id] = (cart[id] || 0) + 1;
      updateCartUI();
      renderProducts();
    }

    function changeQty(id, delta) {
      const next = (cart[id] || 0) + delta;
      if (next <= 0) delete cart[id];
      else cart[id] = next;
      updateCartUI();
      renderProducts();
    }

    function updateCartUI() {
      let totalQty = 0;
      let totalSum = 0;
      for (const [id, qty] of Object.entries(cart)) {
        const p = PRODUCTS.find(x => x.id === id);
        if (p) {
          totalQty += qty;
          totalSum += p.price * qty;
        }
      }
      const bar = document.getElementById("cartBar");
      if (totalQty > 0) {
        bar.classList.add("visible");
        document.getElementById("cartCount").textContent = `${totalQty} ${totalQty === 1 ? 'producto' : 'productos'} en tu pedido`;
        document.getElementById("cartTotal").textContent = formatARS(totalSum);
      } else {
        bar.classList.remove("visible");
      }
    }

    function renderProducts() {
      const q = searchTerm.toLowerCase().trim();
      const filtered = PRODUCTS.filter(p => {
        const matchCat = activeCat === "TODOS" || p.cat === activeCat;
        const matchText = !q || p.name.toLowerCase().includes(q) || p.brand.toLowerCase().includes(q) || p.pres.toLowerCase().includes(q);
        return matchCat && matchText;
      });

      document.getElementById("countBadge").textContent = `${filtered.length} productos`;
      const grid = document.getElementById("productGrid");
      grid.innerHTML = filtered.map(p => {
        const qty = cart[p.id] || 0;
        const actionHTML = qty === 0
          ? `<button class="btn-add" onclick="addToCart('${p.id}')">+ Agregar</button>`
          : `<div class="qty-controls">
               <button class="btn-qty" onclick="changeQty('${p.id}', -1)">-</button>
               <span class="qty-num">${qty}</span>
               <button class="btn-qty" onclick="changeQty('${p.id}', 1)">+</button>
             </div>`;
        return `
          <div class="card">
            ${p.is_new ? '<span class="new-tag">Nuevo</span>' : ''}
            <div>
              <div class="card-cat">${p.brand}</div>
              <div class="card-title">${p.name}</div>
              <div class="card-meta">${p.pres}</div>
            </div>
            <div class="card-footer">
              <span class="price">${formatARS(p.price)}</span>
              ${actionHTML}
            </div>
          </div>
        `;
      }).join("");
    }

    function enviarWhatsApp() {
      let lines = ["Hola *Chui Congelados & Dietética*! Quiero hacer el siguiente pedido:"];
      let total = 0;
      for (const [id, qty] of Object.entries(cart)) {
        const p = PRODUCTS.find(x => x.id === id);
        if (p) {
          const sub = p.price * qty;
          total += sub;
          lines.push(`• ${qty}x ${p.name} (${p.pres}) — ${formatARS(sub)}`);
        }
      }
      lines.push(`\n*Total estimado: ${formatARS(total)}*`);
      const url = `https://wa.me/${TELEFONO_WHATSAPP}?text=${encodeURIComponent(lines.join("\n"))}`;
      window.open(url, "_blank");
    }

    function copiarLink() {
      navigator.clipboard.writeText(window.location.href);
      alert("¡Enlace de la tienda copiado!");
    }

    document.getElementById("searchInput").addEventListener("input", e => {
      searchTerm = e.target.value;
      renderProducts();
    });

    renderTabs();
    renderProducts();
  </script>
